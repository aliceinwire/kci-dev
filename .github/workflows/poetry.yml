name: Poetry

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        uses: abatilo/actions-poetry@v3
      - name: Install shellcheck
        uses: bewuethr/shellcheck-action@v2
      - name: Setup a local virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the project dependencies
        with:
          path: ./.venv
          key: >-
            venv-${{ runner.os }}-py${{ matrix.python-version }}-
            ${{ hashFiles('pyproject.toml') }}
      - name: Install the project dependencies
        run: poetry install
      - name: Lint check with python black
        run: poetry run black --check --verbose .
      - name: Isort check
        run: poetry run isort . --profile black --check --diff
      - name: Tox check (pytest)
        run: poetry run tox -e ${{ matrix.tox-env }}
